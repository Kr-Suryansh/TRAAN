name: CI Pipeline

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: sih
          POSTGRES_PASSWORD: sih_dev_secret
          POSTGRES_DB: sih_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Migrations
        env:
          DATABASE_URL: "postgresql+asyncpg://sih:sih_dev_secret@localhost:5432/sih_db"
        run: alembic upgrade head
      - name: Run Tests
        env:
          DATABASE_URL: "postgresql+asyncpg://sih:sih_dev_secret@localhost:5432/sih_db"
        run: pytest -v
