[versions]
agp                     = "8.7.3"
kotlin                  = "2.0.21"
ksp                     = "2.0.21-1.0.27"
compose-bom             = "2024.12.01"
activity-compose        = "1.10.1"
hilt                    = "2.51.1"
hilt-androidx           = "1.2.0"
room                    = "2.6.1"
workmanager             = "2.10.0"
retrofit                = "2.11.0"
okhttp                  = "4.12.0"
moshi                   = "1.15.1"
core-ktx                = "1.15.0"
lifecycle               = "2.8.7"
navigation-compose      = "2.8.5"
security-crypto         = "1.1.0-alpha06"
play-services-location  = "21.3.0"
coroutines              = "1.8.1"
mockk                   = "1.13.11"

# A+B relay engine dependencies (from mesh-relay)
nearbyConnections       = "19.2.0"
kotlinxSerialization    = "1.7.1"

[libraries]
# ── AndroidX Core ────────────────────────────────────────────────────────────
androidx-core-ktx                   = { group = "androidx.core",      name = "core-ktx",                    version.ref = "core-ktx" }
androidx-lifecycle-runtime-ktx      = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx",       version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose= { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx    = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx",     version.ref = "lifecycle" }

# ── Jetpack Compose ───────────────────────────────────────────────────────────
compose-bom                  = { group = "androidx.compose",   name = "compose-bom",           version.ref = "compose-bom" }
compose-ui                   = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics          = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling           = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview   = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3            = { group = "androidx.compose.material3",   name = "material3" }
compose-material-icons-ext   = { group = "androidx.compose.material",   name = "material-icons-extended" }
activity-compose             = { group = "androidx.activity",  name = "activity-compose",   version.ref = "activity-compose" }
navigation-compose           = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation-compose" }

# ── Hilt DI ──────────────────────────────────────────────────────────────────
hilt-android            = { group = "com.google.dagger",  name = "hilt-android",          version.ref = "hilt" }
hilt-android-compiler   = { group = "com.google.dagger",  name = "hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt",      name = "hilt-navigation-compose", version.ref = "hilt-androidx" }
hilt-work               = { group = "androidx.hilt",      name = "hilt-work",             version.ref = "hilt-androidx" }
hilt-compiler           = { group = "androidx.hilt",      name = "hilt-compiler",         version.ref = "hilt-androidx" }

# ── Room ─────────────────────────────────────────────────────────────────────
room-runtime   = { group = "androidx.room", name = "room-runtime",  version.ref = "room" }
room-ktx       = { group = "androidx.room", name = "room-ktx",      version.ref = "room" }
room-compiler  = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
room-testing   = { group = "androidx.room", name = "room-testing",  version.ref = "room" }

# ── WorkManager ──────────────────────────────────────────────────────────────
work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workmanager" }
work-testing     = { group = "androidx.work", name = "work-testing",     version.ref = "workmanager" }

# ── Retrofit + OkHttp ────────────────────────────────────────────────────────
retrofit                    = { group = "com.squareup.retrofit2", name = "retrofit",            version.ref = "retrofit" }
retrofit-converter-moshi    = { group = "com.squareup.retrofit2", name = "converter-moshi",     version.ref = "retrofit" }
okhttp                      = { group = "com.squareup.okhttp3",   name = "okhttp",              version.ref = "okhttp" }
okhttp-logging-interceptor  = { group = "com.squareup.okhttp3",   name = "logging-interceptor", version.ref = "okhttp" }

# ── Moshi ────────────────────────────────────────────────────────────────────
moshi-kotlin        = { group = "com.squareup.moshi", name = "moshi-kotlin",        version.ref = "moshi" }
moshi-kotlin-codegen= { group = "com.squareup.moshi", name = "moshi-kotlin-codegen",version.ref = "moshi" }

# ── Security ─────────────────────────────────────────────────────────────────
security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "security-crypto" }

# ── Location ─────────────────────────────────────────────────────────────────
play-services-location = { group = "com.google.android.gms", name = "play-services-location", version.ref = "play-services-location" }

# ── Nearby Connections (A+B relay engine) ────────────────────────────────────
play-services-nearby = { group = "com.google.android.gms", name = "play-services-nearby", version.ref = "nearbyConnections" }

# ── Coroutines ───────────────────────────────────────────────────────────────
kotlinx-coroutines-android       = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android",       version.ref = "coroutines" }
kotlinx-coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "coroutines" }
kotlinx-coroutines-test          = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test",           version.ref = "coroutines" }

# ── Kotlin Serialization (A+B relay payload codec) ───────────────────────────
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# ── Testing ──────────────────────────────────────────────────────────────────
junit                        = { group = "junit",                name = "junit",         version = "4.13.2" }
androidx-test-ext-junit      = { group = "androidx.test.ext",    name = "junit",         version = "1.2.1" }
androidx-test-espresso-core  = { group = "androidx.test.espresso",name = "espresso-core",version = "3.6.1" }
compose-ui-test-junit4       = { group = "androidx.compose.ui",  name = "ui-test-junit4" }
compose-ui-test-manifest     = { group = "androidx.compose.ui",  name = "ui-test-manifest" }
mockk                        = { group = "io.mockk", name = "mockk", version.ref = "mockk" }

[plugins]
android-application  = { id = "com.android.application",                    version.ref = "agp" }
android-library      = { id = "com.android.library",                        version.ref = "agp" }
kotlin-android       = { id = "org.jetbrains.kotlin.android",               version.ref = "kotlin" }
kotlin-compose       = { id = "org.jetbrains.kotlin.plugin.compose",        version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization",  version.ref = "kotlin" }
hilt-android         = { id = "com.google.dagger.hilt.android",            version.ref = "hilt" }
ksp                  = { id = "com.google.devtools.ksp",                   version.ref = "ksp" }
