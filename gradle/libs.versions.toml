[versions]
# Android Gradle Plugin
agp = "8.5.2"

# Kotlin (must be compatible with AGP 8.5.x)
kotlin = "2.0.0"

# AndroidX
coreKtx = "1.13.1"

# Google Play Services — Nearby Connections API
# Used by :relay for phone-to-phone BLE/WiFi-Direct relay
nearbyConnections = "19.2.0"

# Kotlin Coroutines (Flow used in RelayApi.getRelayStore())
coroutines = "1.8.1"

# Kotlin Serialization (JSON encoding of SOSRequest/RelayManifest for Nearby Connections payloads)
kotlinxSerialization = "1.7.1"

# Testing
junit = "4.13.2"

# Room (persistence for :data — Component C)
room = "2.6.1"

# Moshi (Room TypeConverter JSON — Component C)
moshi = "1.15.1"

# EncryptedSharedPreferences (device identity — Component C)
securityCrypto = "1.1.0-alpha06"

# MockK (JVM unit-test mocking — Component C test style)
mockk = "1.13.11"


[libraries]
# AndroidX
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }

# Nearby Connections — primary transport layer for :relay
play-services-nearby = { group = "com.google.android.gms", name = "play-services-nearby", version.ref = "nearbyConnections" }

# Coroutines
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test    = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test",    version.ref = "coroutines" }

# JSON Serialization
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# Testing
junit = { group = "junit", name = "junit", version.ref = "junit" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }

# Room — persistence for :data (Component C)
room-runtime  = { group = "androidx.room", name = "room-runtime",  version.ref = "room" }
room-ktx      = { group = "androidx.room", name = "room-ktx",      version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# Moshi — JSON for Room TypeConverters (Component C)
moshi-kotlin = { group = "com.squareup.moshi", name = "moshi-kotlin", version.ref = "moshi" }

# EncryptedSharedPreferences — device identity (Component C)
security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }


[plugins]
android-application  = { id = "com.android.application",                    version.ref = "agp" }
android-library      = { id = "com.android.library",                        version.ref = "agp" }
kotlin-android       = { id = "org.jetbrains.kotlin.android",               version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization",  version.ref = "kotlin" }
